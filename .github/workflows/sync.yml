name: Sync to Infinity-X-Devices

on:
  push:
    branches:
      - 16

jobs:
  sync:
    if: github.repository == 'Haydn-Lab/vendor_xiaomi_sm8350-common'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"

      - name: Force Push to Target Repository
        run: |

          git config --unset-all http.https://github.com/.extraheader

          git remote add target https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/Infinity-X-Devices/vendor_xiaomi_sm8350-common.git

          git lfs uninstall

          git push target 16:16 --force
